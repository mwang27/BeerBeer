services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superset}
      POSTGRES_DB:       ${POSTGRES_DB:-superset}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts: 1) create beerbeer warehouse db, 2) load schema/seed/views
      - ./data/init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ./data/sql:/docker-entrypoint-initdb.d/sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries:  10

  redis:
    image: redis:7-alpine
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries:  10

  superset:
    image: apache/superset:4.1.1
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set in .env}
      DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER:-superset}:${POSTGRES_PASSWORD:-superset}@postgres:5432/${POSTGRES_DB:-superset}
      REDIS_HOST: redis
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset_config:/app/pythonpath:ro
    ports:
      - "8088:8088"
    command:
      - /bin/bash
      - -c
      - |
        set -e
        pip install --quiet psycopg2-binary
        superset db upgrade
        superset fab create-admin \
          --username "${ADMIN_USERNAME:-admin}" \
          --firstname Admin --lastname User \
          --email admin@beerbeer.local \
          --password "${ADMIN_PASSWORD:-admin}" || true
        superset init
        exec gunicorn -b 0.0.0.0:8088 -w 4 --timeout 120 \
                      "superset.app:create_app()"

volumes:
  pgdata:
